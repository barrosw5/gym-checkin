<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ginásio Demo</title>
    <meta name="description" content="Projeto de demonstração: entrada e saída de um ginásio fictício, e quanta gente está lá agora." />

    <!-- Tab icon: SVG stays sharp at any size -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable app (PWA). No service worker on purpose: live occupancy
         must never come from an old cache -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest icons: it needs its own PNG -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Ginásio" />
    <!-- Browser bar colour on Android: the header (ThemeProvider updates it) -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Picks the theme before the first paint, so a dark-theme user never
         sees a white flash while the app loads. Same rule as themeService -->
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch {
          // Storage blocked: follow the device
        }
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
