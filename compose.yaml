# Try the whole app locally: `docker compose up`, then http://localhost:3000
# Local only: the passwords below are public on purpose, never use them for
# real data (the on-prem install of phase 8 gets its own secrets).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gym
    volumes:
      - db-data:/var/lib/postgresql/data
    # The app waits for this, so its migrations never hit a database that is still starting
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 2s
      retries: 30

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://gym:gym@db:5432/gym
      JWT_SECRET: local-only-jwt-secret-do-not-use-in-production
      QR_SECRET: local-only-qr-secret-do-not-use-in-production
      NODE_ENV: production
      # Same demo accounts as the README; admin only exists locally
      SEED_STUDENT_PASSWORD: estudante-demo
      SEED_RECEPTION_PASSWORD: rececao-demo
      SEED_ADMIN_PASSWORD: admin-local-only
    depends_on:
      db:
        condition: service_healthy
    # The image has no curl: Node's fetch checks the same route Render uses
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      start_period: 60s
      retries: 30

volumes:
  db-data:
