name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel older runs of the same PR when new commits are pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code
permissions:
  contents: read

jobs:
  api:
    name: API (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    env:
      # Dummy value: prisma generate only needs the variable to exist, it does not connect
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from packageManager in the root package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Same Node version as production (Render reads .node-version too)
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API imports the compiled shared package (dist/), so build it first
      - run: pnpm --filter @gym-checkin/shared build
      # Shared schemas are business rules too; run here so they're a required check
      - run: pnpm --filter @gym-checkin/shared test
      # @prisma/client postinstall is disabled in pnpm-workspace.yaml, so generate explicitly
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from packageManager in the root package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Same Node version as production (Render reads .node-version too)
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The web app imports the compiled shared package (dist/), so build it first
      - run: pnpm --filter @gym-checkin/shared build
      - run: pnpm lint
      - run: pnpm build
